<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌾 Grain Farm Mobile 2.0</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg,#1b5e20,#0d3b16);
    color:white;
    overflow:hidden;
}

/* APP */
#app{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* TOP */
#top{
    background:#2e7d32;
    padding:10px;
    text-align:center;
    border-bottom:2px solid rgba(255,255,255,0.2);
}

#title{font-weight:900;font-size:18px}

#stats{
    display:flex;
    justify-content:space-around;
    margin-top:6px;
    font-size:14px;
}

/* FIELD */
#field{
    flex:1;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:8px;
    padding:10px;
}

.plot{
    background:#5d4037;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:26px;
    border:2px solid rgba(255,255,255,0.15);
    position:relative;
    overflow:hidden;
    transition:0.2s;
}

.plot:active{
    transform:scale(0.92);
}

.progress{
    position:absolute;
    bottom:0;
    left:0;
    height:6px;
    background:#76ff03;
    width:0%;
    transition:0.3s;
}

.timer{
    font-size:10px;
    opacity:0.7;
}

/* PARTICLES */
.particle{
    position:absolute;
    pointer-events:none;
    font-size:14px;
    animation:fly 1s linear forwards;
}

@keyframes fly{
    0%{opacity:1;transform:translateY(0)}
    100%{opacity:0;transform:translateY(-40px)}
}

/* PANEL */
#panel{
    background:#2e7d32;
    padding:10px;
    border-top:2px solid rgba(255,255,255,0.2);
}

.btn{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:none;
    border-radius:12px;
    font-weight:800;
    background:linear-gradient(45deg,#fbc02d,#f57f17);
    color:#1b1b1b;
    font-size:14px;
    box-shadow:0 4px 0 #c49000;
}

.btn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 #c49000;
}

.shop{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

/* TUTORIAL */
#tutorial{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
}

#tutorialBox{
    background:#2e7d32;
    padding:20px;
    border-radius:16px;
    text-align:center;
    width:85%;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div id="tutorial">
<div id="tutorialBox">
<h2>🌾 Grain Farm</h2>
<p>
👉 Тап по пустой грядке — посадить<br>
🌱 Подожди рост<br>
🌾 Тап по зрелому — собрать<br>
💰 Продай зерно<br>
🛒 Улучшай ферму
</p>
<button class="btn" onclick="closeTutorial()">Начать игру</button>
</div>
</div>

<div id="app">

<div id="top">
<div id="title">🌾 Grain Farm</div>
<div id="stats">
<div>💰 <span id="money">100</span></div>
<div>🌾 <span id="grain">0</span></div>
</div>
</div>

<div id="field"></div>

<div id="panel">
<button class="btn" onclick="sell()">💰 Продать зерно</button>

<div class="shop">
<button onclick="buySpeed()">⚡ Рост<br><span id="speedPrice">50</span>💰</button>
<button onclick="buyPrice()">💰 Цена<br><span id="pricePrice">80</span>💰</button>
<button onclick="buyField()">🌱 Грядка<br><span id="fieldPrice">120</span>💰</button>
<button onclick="buyAuto()">🤖 Автосбор<br><span id="autoPrice">200</span>💰</button>
</div>
</div>

</div>

<script>
let money=100, grain=0;
let growSpeed=1, grainPrice=2;
let speedPrice=50, pricePrice=80, fieldPrice=120, autoPrice=200;
let autoCollect=false;

let size=4;
let plots=[];
const stages=["🟫","🌱","🌿","🌾"];
const growTime=4;

const field=document.getElementById("field");

function closeTutorial(){
document.getElementById("tutorial").style.display="none";
}

function save(){
localStorage.setItem("farm2Save",JSON.stringify({
money,grain,growSpeed,grainPrice,
speedPrice,pricePrice,fieldPrice,autoPrice,
autoCollect,size,plots, time:Date.now()
}));
}

function load(){
let d=localStorage.getItem("farm2Save");
if(d){
d=JSON.parse(d);
money=d.money??100;
grain=d.grain??0;
growSpeed=d.growSpeed??1;
grainPrice=d.grainPrice??2;
speedPrice=d.speedPrice??50;
pricePrice=d.pricePrice??80;
fieldPrice=d.fieldPrice??120;
autoPrice=d.autoPrice??200;
autoCollect=d.autoCollect??false;
size=d.size??4;
plots=d.plots??[];
}
}

function createPlots(){
plots=[];
for(let i=0;i<size*size;i++){
plots.push({stage:0,t:0});
}
}

function init(){
field.innerHTML="";
field.style.gridTemplateColumns=`repeat(${size},1fr)`;

if(plots.length!==size*size) createPlots();

plots.forEach((p,i)=>{
let d=document.createElement("div");
d.className="plot";
d.innerHTML=`${stages[p.stage]}
<div class="timer"></div>
<div class="progress"></div>`;
d.addEventListener("click",()=>clickPlot(i,d));
field.appendChild(d);
});
updateUI();
}

function particle(x,y,text){
let p=document.createElement("div");
p.className="particle";
p.innerText=text;
p.style.left=x+"px";
p.style.top=y+"px";
document.body.appendChild(p);
setTimeout(()=>p.remove(),1000);
}

function clickPlot(i,el){
let p=plots[i];
if(p.stage===0){
p.stage=1;p.t=0;
}
else if(p.stage===3){
grain++;
p.stage=0;p.t=0;
let r=el.getBoundingClientRect();
particle(r.left+r.width/2,r.top,"🌾");
}
update();
save();
}

function grow(){
plots.forEach(p=>{
if(p.stage>0 && p.stage<3){
p.t+=1*growSpeed;
if(p.t>=growTime){
p.stage++;
p.t=0;
}
}
if(autoCollect && p.stage===3){
grain++;
p.stage=0;p.t=0;
}
});
update();
save();
}

function update(){
document.querySelectorAll(".plot").forEach((d,i)=>{
let p=plots[i];
d.childNodes[0].nodeValue=stages[p.stage];

let prog=d.querySelector(".progress");
let tmr=d.querySelector(".timer");

if(p.stage>0 && p.stage<3){
let pr=(p.t/growTime)*100;
prog.style.width=pr+"%";
tmr.innerText=Math.ceil((growTime-p.t)/growSpeed)+"s";
}else{
prog.style.width="0%";
tmr.innerText="";
}
});
updateUI();
}

function updateUI(){
moneyEl.innerText=money;
grainEl.innerText=grain;
speedPriceEl.innerText=speedPrice;
pricePriceEl.innerText=pricePrice;
fieldPriceEl.innerText=fieldPrice;
autoPriceEl.innerText=autoPrice;
}

function sell(){
money+=grain*grainPrice;
grain=0;
updateUI();save();
}

function buySpeed(){
if(money>=speedPrice){
money-=speedPrice;
growSpeed+=0.4;
speedPrice=Math.floor(speedPrice*1.6);
updateUI();save();
}
}

function buyPrice(){
if(money>=pricePrice){
money-=pricePrice;
grainPrice+=1;
pricePrice=Math.floor(pricePrice*1.7);
updateUI();save();
}
}

function buyField(){
if(money>=fieldPrice){
money-=fieldPrice;
size++;
fieldPrice=Math.floor(fieldPrice*1.8);
createPlots();
init();save();
}
}

function buyAuto(){
if(money>=autoPrice){
money-=autoPrice;
autoCollect=true;
autoPrice=Math.floor(autoPrice*2);
updateUI();save();
}
}

const moneyEl=document.getElementById("money");
const grainEl=document.getElementById("grain");
const speedPriceEl=document.getElementById("speedPrice");
const pricePriceEl=document.getElementById("pricePrice");
const fieldPriceEl=document.getElementById("fieldPrice");
const autoPriceEl=document.getElementById("autoPrice");

load();
init();
setInterval(grow,1000);
</script>

</body>
</html>
